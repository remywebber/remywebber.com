<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work | Remy Webber</title>
<meta name="description" content="Project detail pages for Remy Webber, a Brisbane, Queensland-based Director of Photography.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="Remy Webber">
<meta name="theme-color" content="#151412">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FFFEFB;
    --ink:#151412;
    --muted:#8A8674;
    --line:#E3DECD;
    --accent:#8D7153;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:44px 56px 40px;
    flex-wrap:wrap;
    gap:20px;
  }
  .id-block{display:flex;flex-direction:column;align-items:center;}
  .id-block h1{font-size:1.9rem;font-weight:700;letter-spacing:0.01em;text-transform:uppercase;}
  .id-block .role{margin-top:4px;font-size:0.7rem;color:var(--accent);letter-spacing:0.06em;text-transform:uppercase;text-align:center;}
  nav{display:flex;gap:36px;padding-top:8px;}
  nav a{font-size:0.82rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);padding-bottom:4px;border-bottom:1px solid transparent;transition:border-color .15s ease;}
  nav a:hover, nav a.active{border-color:var(--ink);}

  @media (orientation: portrait){
    header{flex-direction:column;align-items:center;text-align:center;}
    nav{justify-content:center;width:100%;padding-top:4px;}
  }

  /* Project detail layout — info panel on the left (sticky), stills
     stacked on the right, in the spirit of greigfraser.com / autumndurald.com */
  main{
    flex:1;
    display:grid;
    grid-template-columns:minmax(240px, 340px) 1fr;
    gap:56px;
    padding:20px 56px 100px;
    align-items:start;
  }

  .project-info{
    position:sticky;
    top:32px;
  }

  /* Prev / next project navigation — sits above the project info,
     rendered in the site's brown accent colour. */
  .project-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:36px;
  }
  /* Circle removed — the button keeps the same 38x38 hit target so
     accidental/imprecise clicks still land, it just no longer draws a
     visible ring around the arrow glyph. */
  .project-nav button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:38px;height:38px;
    border:none;
    background:none;
    color:var(--accent);
    font-size:1.3rem;
    cursor:pointer;
    transition:color .15s ease;
  }
  .project-nav button:hover{color:var(--ink);}

  .project-info h2{
    font-size:clamp(1.5rem, 2.4vw, 2.1rem);
    font-weight:700;
    letter-spacing:0.01em;
    text-transform:uppercase;
    line-height:1.2;
    margin-bottom:14px;
  }
  .project-info .meta{font-size:0.9rem;color:var(--accent);}
  .project-info .camera{font-size:0.82rem;color:var(--accent);margin-top:10px;}

  /* Stills — full-width, native aspect ratio, stacked vertically, like
     scrolling through a reel of frames rather than a cropped thumbnail grid. */
  .stills-column{display:flex;flex-direction:column;gap:10px;}
  .stills-column img{
    width:100%;
    height:auto;
    display:block;
    background:#1a1a18;
    border-radius:2px;
  }

  footer{
    padding:28px 56px 40px;
    font-size:0.75rem;
    color:var(--accent);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
  }
  footer nav{padding-top:0;gap:24px;}
  footer nav a{font-size:0.72rem;display:inline-flex;align-items:center;}
  footer nav a img{width:1em;height:1em;display:block;}
  footer .service-area{max-width:760px;}

  @media(max-width:900px){
    main{grid-template-columns:1fr;gap:32px;padding:10px 24px 60px;}
    .project-info{position:static;}
  }
  @media(max-width:820px){
    header{padding:28px 24px;}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
</style>
</head>
<body>

<header>
  <div class="id-block">
    <a href="../../"><h1>Remy Webber</h1></a>
    <div class="role">Director of Photography</div>
  </div>
  <nav aria-label="Main Navigation">
    <a href="../" class="active">Work</a>
    <a href="../../contact/">Contact</a>
  </nav>
</header>

<main>
  <div class="project-info">
    <div class="project-nav">
      <button id="prevProject" aria-label="Previous project">&larr;</button>
      <button id="nextProject" aria-label="Next project">&rarr;</button>
    </div>
    <h2 id="pTitle"></h2>
    <p class="meta" id="pMeta"></p>
    <p class="camera" id="pCamera"></p>
  </div>
  <div class="stills-column" id="stillsColumn"></div>
</main>

<footer>
  <nav aria-label="Footer">
    <a href="../../">Home</a>
    <a href="../../contact/">Contact</a>
    <a href="https://www.instagram.com/remy_webber/" rel="me noopener noreferrer" target="_blank" aria-label="Instagram"><img src="../../images/icons/instagram.png" alt=""></a>
  </nav>
  <span class="service-area">Available for narrative, documentary, music video and commercial work across Queensland and Australia.</span>
  <span>© 2026 Remy Webber</span>
</footer>

<script>
  /* Same source-of-truth project list as /work/ — kept in sync manually
     since this is a static site with no shared include mechanism. */
  const projects = [
    { title:"Little Pumpkin",       slug:"littlepumpkin",      anchor:"little-pumpkin",             meta:"Dir. Jessica Fisher — Short Film",       count:8,  firstStill:"shortfilm-alexa-mini-lf-tokinavista-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Tokina Vista Primes' },
    { title:"BROOD",                 slug:"brood",               anchor:"brood",                       meta:"Dir. Sasha Aubort — Fashion Film",       count:11, firstStill:"fashionfilm-alexa-mini-lf-canonv35-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Canon V35, Mamiya 645, Angenieux Optimo 24-290mm' },
    { title:"No Devil Lived On",    slug:"nodevillivedon",     anchor:"no-devil-lived-on",           meta:"Dir. Shuban Krishnar — Short Film",      count:8,  firstStill:"shortfilm-alexa-mini-lf-panavisionprimo-ACS-awards-cinematography", camera:'ARRI Alexa Mini — Panavision Primo Noir' },
    { title:"Chasing Harvey",       slug:"chasingharvey",      anchor:"chasing-harvey",              meta:"Dir. Jessica Fisher — Short Film",       count:8,  firstStill:"shortfilm-alexa-mini-lf-dzoanamorphic-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — DZO Pavo 2x Anamorphic' },
    { title:"Housemate from Hell",  slug:"housematefromhell",  anchor:"housemate-from-hell",         meta:"Dir. Jessica Fisher — Short Film",       count:10, firstStill:"shortfilm-alexa-mini-lf-dzoarles-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — DZO Arles Primes' },
    { title:"Travel Money Oz — “Feverdream”", slug:"travelmoneyoz", anchor:"travel-money-oz-feverdream", meta:"Dir. Reilly Vanniekerk — Commercial", count:6, firstStill:"commercial-alexa-mini-lf-tokinavista-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Tokina Vista Primes' },
    { title:"Solitude",             slug:"solitude",            anchor:"solitude",                    meta:"Dir. Maia Jorgensen — Short Film",       count:9,  firstStill:"shortfilm-alexa-mini-lf-mamiya-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Mamiya 645, Zeiss CP2 Primes' },
    { title:"Mud Man",              slug:"mudman",              anchor:"mud-man",                     meta:"Dir. Madi Lee-Hislop — Dance Film",      count:7,  firstStill:"dancefilm-alexa-mini-lf-sigma-ACS-awards-cinematography", camera:'ARRI Alexa Mini LF — Canon Sumire Primes' },
    { title:"Dont Bite",            slug:"dontbite",            anchor:"dont-bite",                   meta:"Dir. Seth Griffiths-Kemp — Visualiser",  count:6,  firstStill:"visualiser-alexa-mini-lf-zeiss-ACS-awards-cinematography", camera:'Sony FX6 — Tokina Vista Primes' }
  ];

  function stillUrl(project, n){
    if(n === 1 && project.firstStill){
      return '/images/work/' + project.slug + '/' + project.firstStill + '.jpeg';
    }
    return '/images/work/' + project.slug + '/' + project.slug + '-' + n + '.jpeg';
  }

  const pTitle = document.getElementById('pTitle');
  const pMeta = document.getElementById('pMeta');
  const pCamera = document.getElementById('pCamera');
  const stillsColumn = document.getElementById('stillsColumn');

  let projIndex = 0;

  function render(){
    const p = projects[projIndex];
    document.title = p.title + ' | Remy Webber';
    pTitle.textContent = p.title;
    pMeta.textContent = p.meta;
    pCamera.textContent = p.camera;

    let stillsHtml = '';
    for(let n = 1; n <= p.count; n++){
      stillsHtml += '<img src="' + stillUrl(p, n) + '" alt="' + p.title + ' — ' + p.meta + ', still ' + n + ', cinematography by Remy Webber" loading="' + (n === 1 ? 'eager' : 'lazy') + '">';
    }
    stillsColumn.innerHTML = stillsHtml;

    history.replaceState(null, '', '#' + p.anchor);
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function goTo(i){
    projIndex = (i + projects.length) % projects.length;
    render();
  }

  document.getElementById('prevProject').addEventListener('click', () => goTo(projIndex - 1));
  document.getElementById('nextProject').addEventListener('click', () => goTo(projIndex + 1));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') goTo(projIndex - 1);
    if(e.key === 'ArrowRight') goTo(projIndex + 1);
  });

  function loadFromHash(){
    const anchor = location.hash.replace('#', '');
    const idx = projects.findIndex(p => p.anchor === anchor);
    projIndex = idx !== -1 ? idx : 0;
    render();
  }

  loadFromHash();
  window.addEventListener('hashchange', loadFromHash);
</script>

</body>
</html>
