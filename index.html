<!-- First-visit default hero image — preloaded so the browser can start

     this preload is simply unused — a small tradeoff for a faster first
     paint on the far more common case of a new visitor's first look. -->

<style>
  :root{
    --paper:#FFFEFB;
    --ink:#151412;
    --muted:#8A8674;
    --line:#E3DECD;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--paper);}

  /* Header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:44px 56px 40px;
    flex-wrap:wrap;
    gap:20px;
  }
  .id-block{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .id-block h1{
    font-size:1.9rem;
    font-weight:700;
    letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .id-block a{display:block;}
  .id-block .role{
    margin-top:4px;
    font-size:0.7rem;
    color:var(--muted);
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-align:center;
  }
  nav{
    display:flex;
    gap:36px;
    padding-top:8px;
  }
  nav a{
    font-size:0.82rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink);
    padding-bottom:4px;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }
  nav a:hover, nav a.active{border-color:var(--ink);}

  @media (orientation: portrait){
    header{
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    nav{
      justify-content:center;
      width:100%;
      padding-top:4px;
    }
  }

  /* Hero */
  .hero-wrap{
    padding:0 56px;
    /* Stays exactly 1500px (as before) until the viewport is wide enough
       that 1500px would actually start starving the hero of room — only
       then does it grow, up to a 2400px ceiling, for extra-large/wide
       monitors. Normal monitor widths are unaffected. */
    max-width:clamp(1500px, 68.2vw, 2400px);
    margin:0 auto;
    height:calc(100vh - 160px); /* JS refines this precisely on load/resize */
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .hero-frame{
    aspect-ratio:16/9;
    border-style:solid;
    border-color:#FFFEFB;
    border-width:14px 18px 52px 18px;
    box-sizing:content-box;
    background:#1a1a18;
    position:relative;
    overflow:hidden;
  }
  .hero-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity 1.1s ease, transform .5s ease;
    transform-origin:50% 50%;
  }
  .hero-img.is-visible{opacity:1;}
  .hero-link{display:block;cursor:pointer;}

  /* See more work — right-aligned above the contact strip. Shares the
     hero-wrap's exact max-width/centering/padding so its right edge
     lines up with the hero frame's right edge (the hero frame spans
     the full width of that box in landscape mode). */
  .more-work{
    display:flex;
    justify-content:flex-end;
    padding:40px 56px 0;
    max-width:clamp(1500px, 68.2vw, 2400px);
    margin:0 auto;
  }
  .more-work a{
    font-size:0.82rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#8D7153;
    padding-bottom:4px;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }
  .more-work a:hover{border-color:#8D7153;}

  /* Contact */
  #contact{
    padding:120px 56px 100px;
    border-top:1px solid var(--line);
    margin-top:60px;
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:48px;
    align-items:stretch;
  }
  /* slightly reduced heading size to pull content up */
  #contact h2{
    font-size:clamp(1.4rem,2.1vw,1.85rem);
    font-weight:600;
    max-width:20ch;
    letter-spacing:-0.01em;
    line-height:1.35;
  }
  /* reduce spacing between the two lines and make both slightly smaller */
  #contact h2 .lead{display:block;margin-bottom:0;font-size:0.98em;line-height:1;color:#8D7153;}
  #contact h2 .sub{display:block;font-size:0.82em;margin-top:0;line-height:1;}
  .contact-details{font-size:0.9rem;color:var(--muted);} 
  .contact-details .row{
    display:flex;
    justify-content:space-between;
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .contact-details .row > :first-child{color:var(--ink);font-weight:500;}
  .contact-details .row > :last-child{color:#8D7153;}
  .contact-details .row .ig-label{display:inline-flex;align-items:center;gap:8px;}
  .contact-details .row .ig-label img{width:1em;height:1em;display:block;}
  .contact-details .row a{border-bottom:1px solid transparent;} 
  .contact-details .row a:hover{border-color:var(--ink);} 

  footer{
    padding:28px 56px 40px;
    font-size:0.75rem;
    color:#8D7153;
    display:flex;
    justify-content:center;
  }

  @media(max-width:820px){
    header{padding:28px 24px;}
    .hero-wrap{padding:0 24px;}
    .more-work{padding:32px 24px 0;}
    #contact{grid-template-columns:1fr;padding:80px 24px 60px;gap:32px;align-items:stretch;}
  }
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
</style>
</head>
<body>

<header>
  <div class="id-block">
    <a href="./"><h1>Remy Webber</h1></a>
    <div class="role">Director of Photography</div>
  </div>
  <nav aria-label="Main Navigation">
    <a href="work/">Work</a>
    <a href="contact/">Contact</a>
  </nav>
</header>

<div class="hero-wrap" id="heroWrap">
  <a class="hero-link" href="work/" aria-label="View more work">
    <div class="hero-frame" id="heroFrame">
      <img class="hero-img" id="heroImgA" alt="">
      <img class="hero-img" id="heroImgB" alt="">
    </div>
  </a>
</div>

<div class="more-work">
  <a href="work/">See more work</a>
</div>

<section id="contact">
  <h2><span class="lead">Let's Work Together!</span><br><span class="sub">Available for all narrative, documentary, music video,<br>and commercial work</span></h2>
  <div class="contact-details">
    <div class="row"><span>Email</span><a href="mailto:info@remywebber.com">info@remywebber.com</a></div>
    <div class="row"><a class="ig-label" href="https://www.instagram.com/remy_webber/" rel="me noopener noreferrer" target="_blank">Instagram<img src="images/icons/instagram.png" alt="Instagram"></a><a href="https://www.instagram.com/remy_webber/" rel="me noopener noreferrer" target="_blank">@remy_webber</a></div>
    <div class="row"><span>Based in</span><span>Queensland, Australia</span></div>
  </div>
</section>

<footer>
  <span>© 2026 Remy Webber</span>
</footer>

<script>
  /* Hero image cycling.
     - First-ever visit: always shows hero-1.
     - Every refresh after that: switches to a random image (different from last shown).
     - While sitting on the page without refreshing: rotates to a new random image
       every 5 minutes, crossfading between frames.
     - focusX (0-100) is the horizontal position of each image's main subject,
       used to re-centre the crop when the hero switches to the 9:16 vertical
       layout on tall/narrow windows.
     - excludeVertical:true means this image never displays in 9:16 mode — if
       the viewport is already vertical, it's skipped when picking a new image;
       if it's currently showing and the viewport turns vertical, the hero
       automatically swaps to a different image.
     Add new entries here as more images come in — nothing else needs to change. */
  const HERO_IMAGES = [
    { src: 'images/hero/hero-1.jpg',  focusX: 50 },
    { src: 'images/hero/hero-2.jpg',  focusX: 50 },
    { src: 'images/hero/hero-3.jpg',  focusX: 66 },
    { src: 'images/hero/hero-4.jpg',  focusX: 50 },
    { src: 'images/hero/hero-5.jpg',  focusX: 52 },
    { src: 'images/hero/hero-6.jpg',  focusX: 50 },
    { src: 'images/hero/hero-7.jpg',  focusX: 64 },
    { src: 'images/hero/hero-8.jpg',  focusX: 50 },
    { src: 'images/hero/hero-9.jpg',  focusX: 50 },
    { src: 'images/hero/hero-10.jpg', focusX: 50 },
    { src: 'images/hero/hero-11.jpg', focusX: 50 },
    { src: 'images/hero/hero-12.jpg', focusX: 50 },
    { src: 'images/hero/hero-14.jpg', focusX: 50 },
    { src: 'images/hero/hero-15.jpg', focusX: 50, excludeVertical: true },
    { src: 'images/hero/hero-20.jpg', focusX: 50, excludeVertical: true },
    { src: 'images/hero/hero-21.jpg', focusX: 52 },
    { src: 'images/hero/hero-22.jpg', focusX: 49 },
    { src: 'images/hero/hero-23.jpg', focusX: 50 },
    { src: 'images/hero/hero-24.jpg', focusX: 52 },
    { src: 'images/hero/hero-25.jpg', focusX: 47 },
    { src: 'images/hero/hero-26.jpg', focusX: 50 },
    { src: 'images/hero/hero-27.jpg', focusX: 40 },
    { src: 'images/hero/hero-28.jpg', focusX: 33 },
    { src: 'images/hero/hero-29.jpg', focusX: 58 },
    { src: 'images/hero/hero-30.jpg', focusX: 46 }
  ];

  const heroFrame = document.getElementById('heroFrame');
  const heroImgA = document.getElementById('heroImgA');
  const heroImgB = document.getElementById('heroImgB');
  let heroActiveImg = heroImgA;
  let heroHiddenImg = heroImgB;
  let heroCurrentIndex = 0;
  let heroMode = 'landscape';

  function applyFocusToActiveImg(){
    const focusX = HERO_IMAGES[heroCurrentIndex].focusX;
    heroActiveImg.style.objectPosition = (heroMode === 'vertical')
      ? focusX + '% 50%'
      : '50% 50%';
  }

  function isViewportVertical(){
    return window.innerHeight > window.innerWidth * 1.05;
  }

  function pickRandomIndex(excludeIndex, avoidVerticalExcluded){
    let pool = HERO_IMAGES.map((_, i) => i);
    if(excludeIndex !== null && excludeIndex !== undefined){
      pool = pool.filter(i => i !== excludeIndex);
    }
    if(avoidVerticalExcluded){
      const filtered = pool.filter(i => !HERO_IMAGES[i].excludeVertical);
      if(filtered.length > 0) pool = filtered;
    }
    if(pool.length === 0) pool = HERO_IMAGES.map((_, i) => i);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function pickStartIndex(){
    let visited = null;
    let lastIndex = null;
    try{
      visited = localStorage.getItem('heroVisited');
      lastIndex = parseInt(localStorage.getItem('heroCurrentIndex'), 10);
    }catch(e){ /* storage unavailable — fall through to random */ }

    if(!visited){
      try{
        localStorage.setItem('heroVisited', '1');
        localStorage.setItem('heroCurrentIndex', '0');
      }catch(e){}
      return 0;
    }

    if(isNaN(lastIndex)) lastIndex = -1;
    const next = pickRandomIndex(lastIndex, isViewportVertical());
    try{ localStorage.setItem('heroCurrentIndex', String(next)); }catch(e){}
    return next;
  }

  function heroAlt(index){
    return 'Cinematography still ' + (index + 1) + ' by Remy Webber, Brisbane-based Director of Photography';
  }

  function crossfadeHeroTo(index){
    heroCurrentIndex = index;
    heroHiddenImg.src = HERO_IMAGES[index].src;
    heroHiddenImg.alt = heroAlt(index);
    heroHiddenImg.style.objectPosition = (heroMode === 'vertical')
      ? HERO_IMAGES[index].focusX + '% 50%'
      : '50% 50%';
    heroHiddenImg.classList.add('is-visible');
    heroActiveImg.classList.remove('is-visible');
    const tmp = heroActiveImg;
    heroActiveImg = heroHiddenImg;
    heroHiddenImg = tmp;
    try{ localStorage.setItem('heroCurrentIndex', String(index)); }catch(e){}
  }

  // Initial paint (no fade — set directly so it's visible immediately)
  heroCurrentIndex = pickStartIndex();
  heroImgA.src = HERO_IMAGES[heroCurrentIndex].src;
  heroImgA.alt = heroAlt(heroCurrentIndex);
  heroImgA.fetchPriority = 'high';
  heroImgA.classList.add('is-visible');

  // Idle rotation every 5 minutes while the page stays open
  const HERO_IDLE_MS = 5 * 60 * 1000;
  setInterval(function(){
    const next = pickRandomIndex(heroCurrentIndex, heroMode === 'vertical');
    crossfadeHeroTo(next);
  }, HERO_IDLE_MS);

  /* Fit the hero to exactly fill the space below the header, so the contact
     strip stays off-screen until the user scrolls — regardless of window size. */
  const heroWrap = document.getElementById('heroWrap');
  const headerEl = document.querySelector('header');

  function sizeHero(){
    const headerH = headerEl.offsetHeight;
    const rawAvailH = Math.max(window.innerHeight - headerH, 200);
    /* Mirrors the horizontal fix: normal window heights pass through
       untouched, but extra-long/tall vertical displays are capped so the
       hero doesn't grow unbounded and run off the bottom of the screen. */
    const VERTICAL_HEIGHT_CEILING = 2400;
    const baseAvailH = Math.min(rawAvailH, VERTICAL_HEIGHT_CEILING);

    const wrapStyles = getComputedStyle(heroWrap);
    const padX = parseFloat(wrapStyles.paddingLeft) + parseFloat(wrapStyles.paddingRight);
    const availW = heroWrap.clientWidth - padX;

    /* Fixed distances from the image content to the window edge — these stay
       constant in px regardless of window size. Bottom is intentionally the
       largest so there's a clear resting margin below the frame. */
    const topBorder = 14;
    const bottomBorder = 52;
    const sideBorderBase = 18;

    let contentW, contentH, sideBorder;
    const previousMode = heroMode;

    if(baseAvailH > availW * 1.05){
      /* Viewport is more than 5% taller than it is wide: switch to a 9:16
         vertical frame. Side borders stay fixed (never grow) here. */
      heroMode = 'vertical';
      sideBorder = sideBorderBase;
      contentW = Math.max(availW - (sideBorder * 2), 60);
      contentH = contentW * (16 / 9);
      const maxContentH = baseAvailH - topBorder - bottomBorder;
      if(contentH > maxContentH){
        contentH = Math.max(maxContentH, 60);
        contentW = contentH * (9 / 16);
      }
      // Increase hero image size by 10% in vertical mode (visual zoom)
      const ZOOM = 1.10;
      // We apply a visual zoom to the image contents and add a small extra
      // buffer to the heroWrap height so the following contact strip
      // stays off-screen on load.
      const extraForViewport = Math.ceil(contentH * (ZOOM - 1));

      heroFrame.style.width = contentW + 'px';
      heroFrame.style.height = contentH + 'px';
      heroFrame.style.borderTopWidth = topBorder + 'px';
      heroFrame.style.borderBottomWidth = bottomBorder + 'px';
      heroFrame.style.borderLeftWidth = sideBorder + 'px';
      heroFrame.style.borderRightWidth = sideBorder + 'px';

      // Apply the 10% visual zoom to the hero images (they're absolutely positioned inside the frame)
      heroActiveImg.style.transform = 'scale(' + ZOOM + ')';
      heroHiddenImg.style.transform = 'scale(' + ZOOM + ')';

      // Increase the heroWrap height by the extra zoom amount so that the
      // next section remains off-screen on initial load.
      heroWrap.style.height = (baseAvailH + extraForViewport) + 'px';

      // If the currently showing image is flagged excludeVertical, swap it
      // out to one that works for vertical cropping.
      if(HERO_IMAGES[heroCurrentIndex].excludeVertical){
        crossfadeHeroTo(pickRandomIndex(heroCurrentIndex, true));
      } else if(heroMode !== previousMode){
        applyFocusToActiveImg();
      }

      return;
    } else {
      /* Landscape (or only mildly portrait, under the 5% threshold): fill
         full available height at 16:9, letting the side borders grow to
         soak up any extra width on wide displays. */
      heroMode = 'landscape';
      const ratio = 16 / 9;
      contentH = Math.max(baseAvailH - topBorder - bottomBorder, 60);
      contentW = contentH * ratio;
      const maxContentW = availW - (sideBorderBase * 2);
      if(contentW > maxContentW){
        contentW = Math.max(maxContentW, 60);
        contentH = contentW / ratio;
        sideBorder = sideBorderBase;
      } else {
        sideBorder = (availW - contentW) / 2;
      }

      heroFrame.style.width = contentW + 'px';
      heroFrame.style.height = contentH + 'px';
      heroFrame.style.borderTopWidth = topBorder + 'px';
      heroFrame.style.borderBottomWidth = bottomBorder + 'px';
      heroFrame.style.borderLeftWidth = sideBorder + 'px';
      heroFrame.style.borderRightWidth = sideBorder + 'px';

      // Reset any visual zoom we applied in vertical mode
      heroActiveImg.style.transform = '';
      heroHiddenImg.style.transform = '';

      // Use the normal heroWrap height (fills available area below header)
      heroWrap.style.height = baseAvailH + 'px';

      if(heroMode !== previousMode){
        applyFocusToActiveImg();
      }

      return;
    }
  }

  sizeHero();
  applyFocusToActiveImg();
  window.addEventListener('resize', sizeHero);

  /* Align the contact heading's first and last line exactly with the top
     and bottom of the contact-details block, regardless of copy length. */
  function fitContactHeading(){
    const heading = document.querySelector('#contact h2');
    const details = document.querySelector('.contact-details');
    if(!heading || !details) return;

    const fontSizePx = parseFloat(getComputedStyle(heading).fontSize);
    const baseLineHeight = fontSizePx * 1.35; // matches the CSS's intended ratio, in px

    heading.style.height = 'auto';
    heading.style.lineHeight = baseLineHeight + 'px';

    const naturalH = heading.offsetHeight;
    const lines = Math.max(Math.round(naturalH / baseLineHeight), 1);
    const targetH = details.offsetHeight;

    if(lines > 0 && targetH > 0){
      // Don't allow the computed line-height to grow unbounded — cap it so
      // the two-line heading doesn't spread too far apart when the details
      // block is tall. This keeps the "Let's work together" lines visually
      // closer together while still aligning reasonably with the details box.
      let desiredLineHeight = (targetH / lines);
      const maxLineHeight = baseLineHeight * 1.02; // much tighter cap so lines stay close
      if(desiredLineHeight > maxLineHeight) desiredLineHeight = maxLineHeight;

      heading.style.lineHeight = desiredLineHeight + 'px';
      heading.style.height = (desiredLineHeight * lines) + 'px';
    }
  }

  fitContactHeading();
  window.addEventListener('resize', fitContactHeading);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitContactHeading);
  }
</script>

</body>
</html>
